<section class="diagram no-foot" id="lv-a-01">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>Ping-based LV System Overview</title>
<desc>A declared facility holding a landmark node, the facility network and a GPU host. A timed challenge runs from that landmark node through the network, the attestation client and the NVIDIA driver to the security function of the enrolled GPU, and a signed response returns the same way. More landmark nodes spread outside the facility send challenges over the same network. All evidence goes to one evidence log at an assurance service outside the facility, which serves a relying party.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<title>PLV Evidence Collection</title>
<desc>One timed challenge, end to end, across six lanes. The landmark node schedules a challenge, generates a nonce, starts a timer and sends the challenge. It crosses the open internet and the operator network, the attestation client forwards it to the NVIDIA driver, and the GPU security function signs a report bound to the nonce. The response returns the same way; the landmark node stops the timer, matches the response to the challenge and writes a measurement record, which goes to the evidence log and on to the assurance service.</desc>
